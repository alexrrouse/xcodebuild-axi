name: Release

# Tag-triggered rather than a release-please PR: the commit history here is
# prose, not conventional commits, so the version is chosen deliberately and
# the tag is the trigger. `npm version <bump>` writes both.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # authenticates the npm publish over OIDC

jobs:
  release:
    # macOS for the same reason CI is: coverage:check reads the installed
    # xcodebuild, and this is the last gate before a version is permanent.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing authenticates over OIDC, which needs npm >= 11.5.1.
      # The macos-15 image's Node 22 ships npm 10.9.8, which does not know how
      # to use the OIDC token and falls back to looking for a registry token
      # that deliberately no longer exists.
      - name: npm new enough for trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      # A tag that disagrees with package.json publishes a version nobody can
      # find from the release notes, and npm will not let it be replaced.
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME implies $tag but package.json says $pkg" >&2
            exit 1
          fi
          echo "releasing $pkg"

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Skill is not stale
        run: npx tsx scripts/build-skill.ts --check

      - name: Coverage map matches this xcodebuild
        run: npm run coverage:check

      # Installing the tarball is the only check that covers `files`, the bin
      # shebang, and the runtime package.json lookup in src/version.ts — all of
      # which pass in this repo and can still be broken in the published one.
      - name: Installed tarball runs
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null
          npm install ./xcodebuild-axi-*.tgz
          test "$(./node_modules/.bin/xcodebuild-axi --version)" = "${GITHUB_REF_NAME#v}"
          ./node_modules/.bin/xcodebuild-axi info

      # No NPM_TOKEN by design. This publishes over OIDC via npm trusted
      # publishing, configured on npmjs.com against this repository and this
      # workflow filename — so renaming this file breaks publishing until that
      # setting is updated. The alternative was a granular token with "bypass
      # 2FA" ticked, which npm's own UI warns against for CI. Provenance is
      # automatic under trusted publishing; --provenance is not needed.
      #
      # Skipping a version already on the registry makes a release re-runnable
      # after a failure in a later step, and covered the bootstrap case: 0.1.0
      # was published by hand, since neither a scoped token nor a trusted
      # publisher can be configured for a package that does not exist yet.
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "xcodebuild-axi@${version}" version >/dev/null 2>&1; then
            echo "xcodebuild-axi@${version} is already on npm - skipping publish"
          else
            npm publish --access public
          fi

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
