name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS because `coverage:check` reads the installed `xcodebuild -help`.
    # The tests themselves are pure and would run anywhere. Note the hosted
    # image is several Xcode major versions behind a current developer machine
    # (16.4 at time of writing), which is why the drift half of that check only
    # fails on the Xcode named by AUTHORED_AGAINST.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The skill is generated from the CLI's own help text, so a flag change
      # that skips the regeneration would ship a skill describing a CLI that no
      # longer exists.
      - name: Skill is not stale
        run: npx tsx scripts/build-skill.ts --check

      # Fails three ways: a stale README percentage, an option the runner's
      # xcodebuild lists that src/surface.ts has never classified (a new Xcode
      # shipped one), and an option the map still claims xcodebuild dropped.
      - name: Coverage map matches this xcodebuild
        run: npm run coverage:check
